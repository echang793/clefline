[project]
name = "clefline"
version = "0.1.0"
description = "Paste a song link, pick an instrument, get sheet music."
requires-python = "==3.11.*"

[tool.uv]
package = false  # an application, not a library: nothing to build or install

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# E/F/W catch real errors, I keeps imports ordered, UP and B catch genuine
# modernisation and bug-prone patterns. The blind-except and subprocess rulesets
# are left off on purpose: this pipeline leans on deliberate fallbacks (beat
# tracker unavailable, a chord symbol music21 cannot parse) where catching
# broadly and moving on is the intended behaviour, and each one is commented.
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# The entry points must extend sys.path before importing project modules.
"src/cli.py" = ["E402"]
"src/server.py" = ["E402"]
