name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # macOS because that is what clefline runs on (CoreML via coremltools, Apple
    # MPS for demucs) and what requirements.lock was resolved for.
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v5

      - name: Install ffmpeg
        run: brew install ffmpeg

      - name: Install dependencies
        # The lock is fully pinned, so --no-deps: CI runs exactly what was tested
        # locally. (The resampy override in overrides.txt only matters when
        # *resolving* from requirements.txt, which is how the lock was made.)
        run: |
          uv venv --python 3.11 .venv
          uv pip install --python .venv/bin/python --no-deps -r requirements.lock

      - name: Lint
        run: .venv/bin/ruff check src tests scripts

      - name: Test (offline)
        run: .venv/bin/python -m pytest tests/ -q
